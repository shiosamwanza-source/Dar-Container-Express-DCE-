<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DCE - Dispatch System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body { font-family: system-ui; background:#f3f4f6; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
  </style>
</head>

<body class="flex justify-center items-center min-h-screen">

<div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-xl">

  <!-- HEADER -->
  <div class="bg-blue-800 text-white p-4">
    <h1 class="text-lg font-bold">DCE Dispatch</h1>
    <p class="text-xs text-blue-200">Container Logistics Network</p>

    <!-- ROLE SWITCH -->
    <div class="flex mt-3 bg-blue-900 rounded overflow-hidden text-xs">
      <button onclick="switchRole('agent')" id="agentBtn"
        class="flex-1 py-2 bg-white text-blue-800 font-bold">
        Agent
      </button>

      <button onclick="switchRole('owner')" id="ownerBtn"
        class="flex-1 py-2 text-white">
        Fleet Owner
      </button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="flex-1 p-4 space-y-4 overflow-y-auto no-scrollbar">

    <!-- ================= AGENT ================= -->
    <div id="agentView" class="space-y-3">

      <h2 class="font-bold text-sm">Clearing Agent Portal</h2>

      <!-- AGENT INFO -->
      <div class="bg-gray-100 p-3 rounded space-y-2">
        <input class="w-full border p-2 rounded text-sm" placeholder="Company Name"/>
        <input class="w-full border p-2 rounded text-sm" placeholder="Phone (OTP)"/>
      </div>

      <!-- TRIP -->
      <div class="bg-gray-100 p-3 rounded space-y-2">
        <p class="text-xs font-bold">🚛 Trip Details</p>

        <input class="w-full border p-2 rounded text-sm" placeholder="Container Number"/>

        <select class="w-full border p-2 rounded text-sm">
          <option>Tazara</option>
          <option>African ICD</option>
          <option>DP World</option>
        </select>

        <select class="w-full border p-2 rounded text-sm" onchange="zoneCheck(this.value)">
          <option>Kibaha / Other Zones</option>
          <option>Kariakoo (Night Only)</option>
        </select>

        <div id="zoneMsg" class="text-[11px] text-gray-600"></div>
      </div>

      <!-- EMPTY CONTAINER -->
      <div class="bg-yellow-50 p-3 rounded space-y-2">
        <p class="text-xs font-bold">📦 Empty Container Return</p>

        <select class="w-full border p-2 rounded text-sm" onchange="emptyCheck(this.value)">
          <option value="none">No Empty Return</option>
          <option value="normal">Nearby Depot</option>
          <option value="kigamboni">Kigamboni Drop</option>
          <option value="icd">ICD Return</option>
        </select>

        <div id="emptyMsg" class="text-[11px] text-gray-600"></div>
      </div>

      <!-- DRIVER -->
      <div class="bg-blue-50 p-3 rounded space-y-2">

        <p class="text-xs font-bold">👨‍✈️ Driver & License</p>

        <input class="w-full border p-2 rounded text-sm" placeholder="Driver Name"/>
        <input class="w-full border p-2 rounded text-sm" placeholder="Driver Phone"/>

        <input id="licenseInput"
          class="w-full border p-2 rounded text-sm font-mono"
          placeholder="License (e.g. DL-12345678)"/>

        <select class="w-full border p-2 rounded text-sm">
          <option>License Class</option>
          <option>C1</option>
          <option>C</option>
          <option>E</option>
        </select>

        <div id="licenseStatus" class="text-[11px] text-gray-600"></div>

      </div>

      <!-- PRICE -->
      <div class="bg-green-50 p-3 rounded text-xs">
        💰 Suggested Price:
        <b>750,000 – 1,200,000 TZS</b>
      </div>

      <button class="w-full bg-blue-600 text-white py-2 rounded font-bold">
        Request Truck
      </button>

    </div>

    <!-- ================= OWNER ================= -->
    <div id="ownerView" class="hidden space-y-3">

      <h2 class="font-bold text-sm">Fleet Owner Dashboard</h2>

      <div class="bg-gray-100 p-3 rounded space-y-2">
        <input class="w-full border p-2 rounded text-sm" placeholder="Owner Name"/>
        <input class="w-full border p-2 rounded text-sm" placeholder="Phone (OTP)"/>
        <input class="w-full border p-2 rounded text-sm" placeholder="Truck Plate"/>
      </div>

      <div class="bg-gray-100 p-3 rounded text-xs">
        📊 Today<br/>
        Trips: 3<br/>
        Revenue: 1,200,000 TZS<br/>
        Active Trucks: 2
      </div>

      <button class="w-full bg-indigo-600 text-white py-2 rounded font-bold">
        Activate Fleet
      </button>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="text-center text-[10px] p-2 text-gray-400 border-t">
    DCE MVP v1.2 • PANDA Logistics
  </div>

</div>

<script>

function switchRole(role){
  document.getElementById("agentView").classList.add("hidden");
  document.getElementById("ownerView").classList.add("hidden");

  document.getElementById(role+"View").classList.remove("hidden");

  if(role === "agent"){
    document.getElementById("agentBtn").classList.add("bg-white","text-blue-800","font-bold");
    document.getElementById("ownerBtn").classList.remove("bg-white","text-blue-800","font-bold");
  } else {
    document.getElementById("ownerBtn").classList.add("bg-white","text-blue-800","font-bold");
    document.getElementById("agentBtn").classList.remove("bg-white","text-blue-800","font-bold");
  }
}

/* ZONE RULE */
function zoneCheck(val){
  const msg = document.getElementById("zoneMsg");

  if(val.includes("Kariakoo")){
    msg.innerHTML = "⚠ Kariakoo: NIGHT ONLY (20:00 - 06:00)";
  } else {
    msg.innerHTML = "✔ 24/7 Available Zone";
  }
}

/* EMPTY CONTAINER */
function emptyCheck(val){
  const msg = document.getElementById("emptyMsg");

  if(val === "none"){
    msg.innerHTML = "✔ No extra cost";
  } else if(val === "normal"){
    msg.innerHTML = "📍 Standard depot return";
  } else if(val === "kigamboni"){
    msg.innerHTML = "⚠ Kigamboni → Extra fuel + time cost";
  } else if(val === "icd"){
    msg.innerHTML = "🏭 ICD return → Queue + handling charges";
  }
}

/* LICENSE VALIDATION */
function checkLicenseStatus(){
  const license = document.getElementById("licenseInput").value;
  const status = document.getElementById("licenseStatus");

  if(!license){
    status.innerHTML = "";
    return;
  }

  const pattern = /^[A-Z]{2}-\d{6,10}$/;

  if(pattern.test(license)){
    status.innerHTML = "✔ Valid License (LOW RISK)";
    status.style.color = "green";
  } else {
    status.innerHTML = "⚠ Invalid Format (HIGH RISK)";
    status.style.color = "orange";
  }
}

/* ATTACH EVENT */
document.addEventListener("DOMContentLoaded", function(){
  document.getElementById("licenseInput")
    .addEventListener("keyup", checkLicenseStatus);
});

</script>

</body>
</html>
